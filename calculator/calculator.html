<!DOCTYPE html>
<html lang="fa">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator</title>
    <link rel="stylesheet" href="calculator.css">
</head>
<body>
    <div class="calculator">
        <div class="display" id="display">0</div>
        <div class="buttons">
            <button class="btnoperator" data-action="backspace">←</button>
            <button class="btnoperator" data-action="clear">C</button>
            <button class="btnoperator" data-action="div">/</button>
            <button class="btnoperator" data-action="multi">*</button>

            <button class="btnnumber" data-number="7">7</button>
            <button class="btnnumber" data-number="8">8</button>
            <button class="btnnumber" data-number="9">9</button>
            <button class="btnoperator" data-action="sub">-</button>

            <button class="btnnumber" data-number="4">4</button>
            <button class="btnnumber" data-number="5">5</button>
            <button class="btnnumber" data-number="6">6</button>
            <button class="btnoperator" data-action="add">+</button>

            <button class="btnnumber" data-number="1">1</button>
            <button class="btnnumber" data-number="2">2</button>
            <button class="btnnumber" data-number="3">3</button>
            <button class="btnoperator equal" data-action="equal">=</button>

            <button class="btnnumber zero" data-number="0">0</button>
            <button class="btnnumber" data-number=".">.</button>
        </div>
    </div>
 <script src="calculator.js"></script>   
</body>
</html>
